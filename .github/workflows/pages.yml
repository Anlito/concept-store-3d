# Met l'outil en ligne sur GitHub Pages à chaque envoi sur la branche main :
# https://anlito.github.io/concept-store-3d/ (index.html, diagnostic.html).
# Les projets des élèves restent sur leur ordinateur : la page n'envoie aucune donnée.
name: Mise en ligne (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Copie de secours des réglages du collège (classes, chemin) : la dernière version publiée par Labo Blocs.
      - name: Mettre à jour les réglages du collège
        run: |
          curl -fsSL https://anlito.github.io/labo-blocs/site/college.js -o /tmp/college.js && grep -q definirCollege /tmp/college.js && cp /tmp/college.js public/college.js || echo "Réglages du collège injoignables : la copie du dépôt est gardée."
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
